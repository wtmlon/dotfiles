# Reload the file with Prefix r.
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# 选中pane快捷键（保留，无性能问题）
bind k select-pane -U \; displayp
bind j select-pane -D \; displayp
bind h select-pane -L \; displayp
bind l select-pane -R \; displayp

# pane resizing（保留，-r 是重复触发，无性能问题）
bind -r K resize-pane -U
bind -r J resize-pane -D
bind -r H resize-pane -L
bind -r L resize-pane -R

# 复制模式中的键盘布局（保留，仅触发时执行，无常驻消耗）
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "~/.local/bin/oclip -i"
bind-key ] run-shell "~/.local/bin/oclip -o | tmux load-buffer -" \; paste-buffer ;

# 支持鼠标（优化：仅开启必要鼠标功能，减少事件监听）
set -g mouse on

# zoom（保留）
bind + resize-pane -Z

# 256 color（优化：统一终端配置，减少渲染冲突）
set -g default-terminal "tmux-256color"  # 统一为 tmux-256color，避免重复定义
set-option -ga terminal-overrides ",xterm-256color:Tc,:TERM:Tc"  # 精简覆盖规则，减少匹配消耗

# 新开窗口默认路径（保留，仅触发时执行）
bind c run-shell 'tmux new-window "cd \"$(tmux show-environment $(echo "TMUXPWD_#D" | tr -d %) | sed -e "s/^.*=//")\"; exec $SHELL"'
bind '"' run-shell 'tmux split-window -v "cd \"$(tmux show-environment $(echo "TMUXPWD_#D" | tr -d %) | sed -e "s/^.*=//")\"; exec $SHELL"'
bind '%' run-shell 'tmux split-window -h "cd \"$(tmux show-environment $(echo "TMUXPWD_#D" | tr -d %) | sed -e "s/^.*=//")\"; exec $SHELL"'

# pane number display（优化：缩短显示时间，减少渲染）
set -g display-panes-active-colour blue
set -g display-panes-colour black
set -g display-panes-time 300  # 从 500ms 减到 300ms，减少画面停留

# pane border（保留，静态样式无性能消耗）
set -g pane-border-style "fg=black"
set -g pane-active-border-style "fg=blue"

# 状态栏刷新间隔（核心优化：从 2 秒→30 秒，大幅降低刷新消耗）
set -g status-interval 30
# esc 时间（优化：恢复默认 500ms，避免高频 esc 事件误判）
set -g escape-time 500

# 窗口名为 cmd 名（优化：关闭自动重命名，减少高频更新）
setw -g allow-rename off
setw -g automatic-rename off  # 关闭自动重命名（核心：避免每秒检测进程名）
setw -g automatic-rename-format "#{pane_current_command}"  # 保留格式，手动重命名时生效

# 缓冲区大小（保留，仅占用内存，无 CPU 消耗）
set -g history-limit 5000

# 绑定 prefix + m 切换鼠标模式（优化：加 -g 全局生效，避免重复执行）
bind-key m if-shell -F '#{mouse}' 'set -g mouse off; display-message "Mouse: OFF"' 'set -g mouse on; display-message "Mouse: ON"'

############ 状态栏 ###############
source ~/.local/etc/tmuxline.conf  # 注意：若 tmuxline 有高频渲染，需检查其配置

# 额外优化：关闭不必要的事件监听（新增）
set -g monitor-activity off    # 关闭窗口活动监控
set -g monitor-bell off        # 关闭铃声监控
set -g visual-activity off     # 关闭活动视觉提示
set -g update-environment ""   # 禁用环境变量自动更新
set -g focus-events off        # 关闭焦点事件（减少终端交互消耗）
